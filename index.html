<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingston Klicker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #171717;
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

header {
  height: 55px;
  background: #101010;
  border-bottom: 2px solid #444;
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 28px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header span {
  color: #aaa;
  font-size: 15px;
}

#game {
  display: flex;
  min-height: calc(100vh - 55px);
}

#main {
  flex: 1;
  text-align: center;
  padding-top: 25px;
  position: relative;
}

#currencyName {
  font-size: 28px;
  font-weight: bold;
}

#kingstons {
  font-size: 52px;
  font-weight: bold;
  margin: 5px;
}

#perSecond {
  color: #aaa;
  font-size: 18px;
}

#clickArea {
  height: 520px;
  display: flex;
  justify-content: center;
  align-items: center;
}

#kingston {
  width: 300px;
  height: 300px;
  border-radius: 50%;
  border: 8px solid #777;
  background: radial-gradient(circle, #ddd, #777);
  box-shadow: 0 0 50px rgba(255,255,255,0.2);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 70px;
  cursor: pointer;
  user-select: none;
  transition: transform 0.08s;
}

#kingston:active {
  transform: scale(0.94);
}

#placeholder {
  font-size: 30px;
  color: #222;
  font-weight: bold;
}

#store {
  width: 380px;
  background: #242424;
  border-left: 3px solid #555;
  padding: 12px;
  overflow-y: auto;
}

#store h2 {
  text-align: center;
  margin: 5px 0 15px;
  font-size: 30px;
}

.item {
  background: #343434;
  border: 2px solid #555;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 9px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.item:hover {
  background: #404040;
}

.item.disabled {
  opacity: 0.45;
}

.itemIcon {
  width: 55px;
  height: 55px;
  background: #555;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
}

.itemInfo {
  flex: 1;
  text-align: left;
}

.itemName {
  font-size: 19px;
  font-weight: bold;
}

.itemDescription {
  color: #aaa;
  font-size: 13px;
  margin-top: 4px;
}

.itemPrice {
  color: #8cff70;
  font-weight: bold;
  margin-top: 5px;
}

.itemOwned {
  color: #aaa;
  font-size: 13px;
}

#bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 380px;
  background: #101010;
  border-top: 2px solid #444;
  padding: 8px;
  text-align: center;
  color: #aaa;
  font-size: 13px;
}

@media (max-width: 750px) {

  #game {
    display: block;
  }

  #store {
    width: 100%;
    border-left: 0;
    border-top: 3px solid #555;
  }

  #clickArea {
    height: 380px;
  }

  #kingston {
    width: 240px;
    height: 240px;
  }

  #bottom {
    position: static;
  }
}
</style>
</head>

<body>

<header>
  <h1>Kingston Klicker</h1>
  <span>Options</span>
  <span>Stats</span>
  <span>Achievements</span>
</header>

<div id="game">

  <main id="main">

    <div id="currencyName">KINGSTONS</div>
    <div id="kingstons">0</div>
    <div id="perSecond">per second: 0</div>

    <div id="clickArea">

      <div id="kingston">
        <div id="placeholder">KINGSTON</div>
      </div>

    </div>

  </main>

  <aside id="store">

    <h2>STORE</h2>

    <div id="storeItems"></div>

  </aside>

</div>

<div id="bottom">
  Kingston Klicker v0.1 — Click Kingston to get Kingstons.
</div>

<script>

let kingstons = 0;
let totalKingstons = 0;
let clickPower = 1;

const buildings = [

  {
    name: "Cursor",
    description: "Automatically clicks Kingston.",
    basePrice: 15,
    production: 0.1,
    owned: 0,
    icon: "☝️"
  },

  {
    name: "Kingston Farm",
    description: "Produces Kingstons.",
    basePrice: 100,
    production: 1,
    owned: 0,
    icon: "🌱"
  },

  {
    name: "Kingston Mine",
    description: "Digs up more Kingstons.",
    basePrice: 500,
    production: 5,
    owned: 0,
    icon: "⛏️"
  },

  {
    name: "Kingston Factory",
    description: "Mass-produces Kingstons.",
    basePrice: 2500,
    production: 20,
    owned: 0,
    icon: "🏭"
  },

  {
    name: "Kingston Bank",
    description: "Turns money into more Kingstons.",
    basePrice: 15000,
    production: 80,
    owned: 0,
    icon: "🏦"
  },

  {
    name: "Kingston Spaceport",
    description: "Imports Kingstons from space.",
    basePrice: 100000,
    production: 400,
    owned: 0,
    icon: "🚀"
  }

];

const kingstonButton = document.getElementById("kingston");

kingstonButton.addEventListener("click", () => {

  kingstons += clickPower;
  totalKingstons += clickPower;

  update();

});

function getPrice(building) {

  return Math.floor(
    building.basePrice *
    Math.pow(1.15, building.owned)
  );

}

function buyBuilding(index) {

  const building = buildings[index];
  const price = getPrice(building);

  if (kingstons >= price) {

    kingstons -= price;
    building.owned++;

    update();
    saveGame();

  }

}

function getPerSecond() {

  let total = 0;

  buildings.forEach(building => {

    total += building.production * building.owned;

  });

  return total;

}

function createStore() {

  const store = document.getElementById("storeItems");

  store.innerHTML = "";

  buildings.forEach((building, index) => {

    const price = getPrice(building);

    const item = document.createElement("div");

    item.className = "item";

    if (kingstons < price) {
      item.classList.add("disabled");
    }

    item.innerHTML = `
      <div class="itemIcon">${building.icon}</div>

      <div class="itemInfo">

        <div class="itemName">
          ${building.name}
        </div>

        <div class="itemDescription">
          ${building.description}
        </div>

        <div class="itemPrice">
          ${price.toLocaleString()} Kingstons
        </div>

        <div class="itemOwned">
          Owned: ${building.owned}
        </div>

      </div>
    `;

    item.onclick = () => buyBuilding(index);

    store.appendChild(item);

  });

}

function update() {

  document.getElementById("kingstons").textContent =
    Math.floor(kingstons).toLocaleString();

  document.getElementById("perSecond").textContent =
    "per second: " +
    getPerSecond().toFixed(1);

  createStore();

}

setInterval(() => {

  const amount = getPerSecond() / 10;

  kingstons += amount;
  totalKingstons += amount;

  update();

}, 100);

function saveGame() {

  const save = {

    kingstons,
    totalKingstons,
    clickPower,

    buildings: buildings.map(building => ({
      owned: building.owned
    }))

  };

  localStorage.setItem(
    "kingstonKlickerSave",
    JSON.stringify(save)
  );

}

function loadGame() {

  const saved =
    localStorage.getItem("kingstonKlickerSave");

  if (!saved) return;

  const data = JSON.parse(saved);

  kingstons = data.kingstons || 0;
  totalKingstons = data.totalKingstons || 0;
  clickPower = data.clickPower || 1;

  if (data.buildings) {

    data.buildings.forEach((savedBuilding, index) => {

      if (buildings[index]) {
        buildings[index].owned =
          savedBuilding.owned || 0;
      }

    });

  }

}

setInterval(saveGame, 5000);

loadGame();
update();

</script>

</body>
</html>
