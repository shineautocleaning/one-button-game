<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don't Press It</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 50px;
    }

    #message {
      font-size: 24px;
      margin: 40px 20px;
    }

    #button {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: white;
      color: black;
      font-size: 28px;
      font-weight: bold;
    }

    #counter {
      margin-top: 30px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>DON'T PRESS IT</h1>

  <div id="message">
    Whatever you do...<br>
    DON'T PRESS THE BUTTON.
  </div>

  <button id="button">DON'T</button>

  <div id="counter">
    Presses: 0
  </div>

  <script>

    let presses = 0;

    const button = document.getElementById("button");
    const message = document.getElementById("message");
    const counter = document.getElementById("counter");

    button.addEventListener("click", function() {

      presses++;

      counter.textContent = "Presses: " + presses;

      if (presses === 1) {
        message.innerHTML = "I TOLD YOU NOT TO.";
      }

      if (presses === 2) {
        message.innerHTML = "Seriously. Stop.";
      }

      if (presses === 3) {
        message.innerHTML = "Why are you still doing this?";
      }

      if (presses === 4) {
        button.textContent = "STOP";
        message.innerHTML = "Okay. Last warning.";
      }

      if (presses === 5) {
        button.style.transform = "scale(0.7)";
        message.innerHTML = "You really don't listen.";
      }

    });

  </script>

</body>
</html>
