<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Button</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin: 15px 0 5px;
}

#score {
  margin-bottom: 10px;
}

canvas {
  width: 95%;
  max-width: 800px;
  border: 2px solid white;
  background: #222;
}

button {
  margin-top: 15px;
  width: 220px;
  height: 70px;
  font-size: 25px;
  font-weight: bold;
  border: none;
  border-radius: 15px;
}
</style>
</head>

<body>

<h1>ONE BUTTON</h1>
<div id="score">Score: 0</div>

<canvas id="game" width="800" height="450"></canvas>

<button onclick="jump()">JUMP</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
  x: 100,
  y: 350,
  size: 35,
  velocity: 0
};

let obstacle = {
  x: 800,
  y: 350,
  width: 40,
  height: 70
};

let score = 0;
let gameOver = false;

function jump() {
  if (gameOver) {
    location.reload();
    return;
  }

  if (player.y >= 350) {
    player.velocity = -10;
  }
}

function gameLoop() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!gameOver) {

    // Gravity
    player.velocity += 0.5;
    player.y += player.velocity;

    // Ground
    if (player.y > 350) {
      player.y = 350;
      player.velocity = 0;
    }

    // Move obstacle
    obstacle.x -= 6;

    // Reset obstacle
    if (obstacle.x < -50) {
      obstacle.x = 800;
      score++;
    }

    // Collision
    if (
      player.x < obstacle.x + obstacle.width &&
      player.x + player.size > obstacle.x &&
      player.y < obstacle.y + obstacle.height &&
      player.y + player.size > obstacle.y
    ) {
      gameOver = true;
    }

    document.getElementById("score").textContent =
      "Score: " + score;
  }

  // Player
  ctx.fillStyle = "white";
  ctx.fillRect(
    player.x,
    player.y,
    player.size,
    player.size
  );

  // Ground
  ctx.fillStyle = "#555";
  ctx.fillRect(0, 385, 800, 65);

  // Obstacle
  ctx.fillStyle = "red";
  ctx.fillRect(
    obstacle.x,
    obstacle.y,
    obstacle.width,
    obstacle.height
  );

  if (gameOver) {
    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.fillText("GAME OVER", 280, 200);

    ctx.font = "20px Arial";
    ctx.fillText("Press JUMP to restart", 295, 240);
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
