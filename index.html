<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Button</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin: 15px 0 5px;
    }

    #score {
      font-size: 20px;
      margin-bottom: 10px;
    }

    canvas {
      display: block;
      margin: auto;
      background: #222;
      border: 2px solid white;
      max-width: 95vw;
    }

    button {
      margin-top: 15px;
      width: 220px;
      height: 70px;
      font-size: 25px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <h1>ONE BUTTON</h1>
  <div id="score">Score: 0</div>

  <canvas id="game" width="800" height="450"></canvas>

  <button id="button">PRESS</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const button = document.getElementById("button");
    const scoreText = document.getElementById("score");

    let player = {
      x: 100,
      y: 200,
      size: 30,
      velocity: 0
    };

    let score = 0;
    let gameOver = false;

    function pressButton() {
      if (gameOver) {
        player.y = 200;
        player.velocity = 0;
        score = 0;
        gameOver = false;
      } else {
        player.velocity = -8;
      }
    }

    button.addEventListener("click", pressButton);

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        player.velocity += 0.4;
        player.y += player.velocity;

        score++;
        scoreText.textContent = "Score: " + score;

        if (player.y < 0 || player.y + player.size > canvas.height) {
          gameOver = true;
        }
      }

      // Player
      ctx.fillStyle = "white";
      ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
      );

      // Ground
      ctx.fillStyle = "#555";
      ctx.fillRect(0, canvas.height - 10, canvas.width, 10);

      if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", 285, 210);

        ctx.font = "20px Arial";
        ctx.fillText("Press the button to restart", 280, 250);
      }

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>

</body>
</html>
